[build]
  command = "npx vite build"
  publish = "dist/public"
  functions = "netlify/functions"

[functions]
  # Prevent bundler from inlining pg's native C bindings
  external_node_modules = ["pg", "pg-native"]
  node_bundler = "esbuild"

# Route /api/contact → Netlify Function (replaces the Express server)
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
  force = true

# SPA catch-all – makes React Router / wouter deep-links work on refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
